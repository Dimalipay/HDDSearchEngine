plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group = 'org.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = "17.0.18"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web' ]
}

def javafxSdkPath = "D:/HDDSearchEngine2/HDDSearchEngine_gemini/javafx-sdk-17.0.18/lib"

// Принудительная кодировка UTF-8 для компиляции и запуска
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'org.example.MainApp'

    // Открываем внутренние пакеты JVM для рефлексии (нужно для injectIntoPath в TikaService)
    applicationDefaultJvmArgs = [
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
    ]
}

dependencies {
    // --- Apache Lucene 9.9.1 ---
    implementation 'org.apache.lucene:lucene-core:9.9.1'
    implementation 'org.apache.lucene:lucene-analysis-common:9.9.1'
    implementation 'org.apache.lucene:lucene-queryparser:9.9.1'
    implementation 'org.apache.lucene:lucene-highlighter:9.9.1'

    // --- Apache Tika (БЕЗ exclude — пусть сам тянет нужный PDFBox) ---
    implementation 'org.apache.tika:tika-core:2.9.1'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'

    // --- PDFBox — единая версия 2.0.31, без дублей ---
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'org.apache.pdfbox:pdfbox-tools:2.0.31'
    implementation 'org.apache.pdfbox:fontbox:2.0.31'
    implementation 'org.apache.pdfbox:xmpbox:2.0.31'
    implementation 'org.apache.pdfbox:jempbox:1.8.17'
    implementation 'com.github.jai-imageio:jai-imageio-jpeg2000:1.4.0'

    // --- Email: PST/OST/MSG/EML (Outlook и стандартные письма) ---
    // java-libpst нужна для чтения .pst и .ost файлов (весь почтовый ящик Outlook)
    // .msg и .eml работают без неё — через стандартный Tika-парсер
    implementation 'com.pff:java-libpst:0.9.3'

    // --- Metadata extractor (EXIF для фото) ---
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // --- Логирование (только log4j2, slf4j-simple УБРАН — конфликт биндингов) ---
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
    implementation 'org.slf4j:slf4j-api:2.0.7'

    // --- JavaFX ---
    implementation 'org.openjfx:javafx-controls:17.0.18'
    implementation 'org.openjfx:javafx-fxml:17.0.18'
    implementation 'org.openjfx:javafx-web:17.0.18'

    // --- Определение кодировки ---
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    // --- Тесты ---
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.apache.lucene:lucene-test-framework:9.9.1'
    testImplementation 'org.apache.pdfbox:pdfbox:2.0.31'
}

// Принудительно разрешаем конфликты версий PDFBox в пользу 2.0.31
configurations.all {
    resolutionStrategy {
        force 'org.apache.pdfbox:pdfbox:2.0.31'
        force 'org.apache.pdfbox:fontbox:2.0.31'
        force 'org.apache.pdfbox:xmpbox:2.0.31'
    }
}

test {
    useJUnitPlatform()
}

// ─── Tesseract бандл ──────────────────────────────────────────────────────────
// Папка tesseract-bundle/ должна лежать в корне проекта рядом с build.gradle.
// Содержимое: tesseract.exe, все *.dll, папка tessdata/ с rus.traineddata и eng.traineddata.
// Если папка отсутствует — задача пропускается (не ошибка, удобно для CI).

def tesseractBundleDir = file('tesseract-bundle')

// Копирует tesseract-bundle/ -> build/installer-input/tesseract/
tasks.register('copyTesseract', Copy) {
    onlyIf { tesseractBundleDir.exists() }
    from tesseractBundleDir
    into layout.buildDirectory.dir('installer-input/tesseract')
    doFirst {
        logger.lifecycle("Копируем Tesseract: ${tesseractBundleDir}")
    }
    doLast {
        logger.lifecycle("Tesseract бандл скопирован.")
    }
}

// Подключаем copyTesseract к jpackage если такая задача существует
// (плагин org.beryx.jlink или аналог)
afterEvaluate {
    if (tasks.findByName('jpackage')) {
        tasks.named('jpackage') {
            dependsOn 'copyTesseract'
            appContent = [
                    layout.buildDirectory.dir('installer-input/tesseract').get().asFile
            ]
        }
    }
}
