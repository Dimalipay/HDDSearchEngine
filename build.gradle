plugins {
    id 'java'
    id 'application'
    // Плагин для JavaFX: автоматически управляет платформозависимыми библиотеками
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group = 'org.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

// Настройка Java 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Настройка JavaFX
javafx {
    version = "17.0.18"
    // Добавляем javafx.web в список модулей
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web' ]
}

def javafxSdkPath = "D:/HDDSearchEngine2/HDDSearchEngine_gemini/javafx-sdk-17.0.18/lib"

// Принудительная кодировка UTF-8 для компиляции и запуска
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    // Точка входа в приложение
    mainClass = 'org.example.MainApp'
}

dependencies {
    // --- Apache Lucene 9.9.1 (Поиск и индексация) ---
    implementation 'org.apache.lucene:lucene-core:9.9.1'
    implementation 'org.apache.lucene:lucene-analysis-common:9.9.1'
    implementation 'org.apache.lucene:lucene-queryparser:9.9.1'
    implementation 'org.apache.lucene:lucene-highlighter:9.9.1'

    // --- Apache Tika (Парсинг документов: Excel, Word, PDF) ---
    implementation 'org.apache.tika:tika-core:3.2.2'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'

    // --- Логирование (устраняет ошибки SLF4J и Log4j2 в консоли) ---
    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.slf4j:slf4j-simple:2.0.7'
    implementation 'org.openjfx:javafx-controls:17.0.18'
    implementation 'org.openjfx:javafx-fxml:17.0.18'
    implementation 'org.openjfx:javafx-web:17.0.18'
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.apache.lucene:lucene-test-framework:9.9.1'
}

test {
    useJUnitPlatform()
}

def installerAppName = 'HDDSearchEngine'
def installerMainClass = 'org.example.MainApp'
def installerVersion = project.version.toString().replace('-SNAPSHOT', '')
def installerType = (findProperty('installerType') ?: 'msi').toString()
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
def runtimeDir = layout.buildDirectory.dir('javafx-runtime').get().asFile

tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Собирает self-contained JAR со всеми зависимостями для jpackage.'

    archiveBaseName.set(installerAppName)
    archiveVersion.set(installerVersion)
    archiveClassifier.set('all')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': installerMainClass
    }

    from(sourceSets.main.output)

    dependsOn(configurations.runtimeClasspath)
    from {
        configurations.runtimeClasspath.get()
                .findAll { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('prepareInstallerInput', Copy) {
    group = 'distribution'
    description = 'Подготавливает input-каталог для jpackage.'

    dependsOn(tasks.named('fatJar'))
    from(tasks.named('fatJar'))
    into(layout.buildDirectory.dir('installer-input'))
}

tasks.register('createRuntimeImage', Exec) {
    group = 'distribution'
    description = 'Создает минимальный runtime (jlink) с JavaFX-модулями для jpackage.'

    onlyIf {
        if (!isWindows) {
            logger.lifecycle('createRuntimeImage пропущен: runtime для Windows собирается только на Windows.')
            return false
        }
        return true
    }

    doFirst {
        if (runtimeDir.exists()) {
            runtimeDir.deleteDir()
        }

        commandLine(
                'jlink',
                '--module-path', "${System.getenv('JAVA_HOME')}/jmods;${javafxSdkPath}",
                '--add-modules', 'java.base,java.desktop,java.logging,java.xml,javafx.controls,javafx.fxml,javafx.web',
                '--output', runtimeDir.absolutePath,
                '--compress', '2',
                '--strip-debug',
                '--no-header-files',
                '--no-man-pages'
        )

        logger.lifecycle("Запуск jlink: ${commandLine.join(' ')}")
    }
}

tasks.register('jpackageInstaller', Exec) {
    group = 'distribution'
    description = 'Собирает Windows-инсталлятор (MSI/EXE) через jpackage. Выполняется только на Windows.'

    dependsOn(tasks.named('prepareInstallerInput'))
    dependsOn(tasks.named('createRuntimeImage'))

    def fatJarTask = tasks.named('fatJar', Jar)
    def installerInputDir = layout.buildDirectory.dir('installer-input').get().asFile
    def destDir = layout.buildDirectory.dir('dist').get().asFile

    onlyIf {
        if (!isWindows) {
            logger.lifecycle('jpackageInstaller пропущен: сборка установщика поддерживается только на Windows.')
            return false
        }
        return true
    }

    doFirst {
        def fatJarName = fatJarTask.get().archiveFileName.get()

        commandLine(
                'jpackage',
                '--type', installerType,
                '--input', installerInputDir.absolutePath,
                '--name', installerAppName,
                '--main-jar', fatJarName,
                '--main-class', installerMainClass,
                '--win-shortcut',
                '--win-menu',
                '--win-dir-chooser',
                '--win-per-user-install',
                '--app-version', installerVersion,
                '--dest', destDir.absolutePath,
                '--runtime-image', runtimeDir.absolutePath
        )

        logger.lifecycle("Запуск jpackage: ${commandLine.join(' ')}")
    }
}

tasks.register('verifyJpackageEnvironment') {
    group = 'verification'
    description = 'Проверяет наличие JDK 16+ и jpackage (а на Windows — напоминает про WiX для MSI).'

    doLast {
        def feature = JavaVersion.current().majorVersion.toInteger()
        if (feature < 16) {
            throw new GradleException("Требуется JDK 16+ для jpackage. Текущая версия: ${JavaVersion.current()}")
        }

        if (System.getenv('JAVA_HOME') == null || System.getenv('JAVA_HOME').isBlank()) {
            throw new GradleException('JAVA_HOME не задан. Для jlink/jpackage нужен корректный JDK 17+ в JAVA_HOME.')
        }

        File jmodsDir = file("${System.getenv('JAVA_HOME')}/jmods")
        if (!jmodsDir.exists()) {
            throw new GradleException("Каталог jmods не найден: ${jmodsDir}. Проверьте JAVA_HOME.")
        }

        File javafxLib = file(javafxSdkPath)
        if (!javafxLib.exists()) {
            throw new GradleException("JavaFX SDK не найден по пути: ${javafxSdkPath}")
        }

        def output = new ByteArrayOutputStream()
        exec {
            commandLine 'jpackage', '--version'
            standardOutput = output
            errorOutput = output
            ignoreExitValue = true
        }

        def text = output.toString().trim()
        if (!text) {
            throw new GradleException('jpackage не найден в PATH. Установите JDK 16+ и проверьте PATH.')
        }

        logger.lifecycle("jpackage доступен: ${text}")
        if (isWindows && installerType == 'msi') {
            logger.lifecycle('Для сборки MSI требуется WiX Toolset в PATH (стандартное требование jpackage).')
        }
    }
}

tasks.register('packageWindowsNoTests') {
    group = 'distribution'
    description = 'Собирает установщик Windows без выполнения тестов.'
    dependsOn(tasks.named('clean'))
    dependsOn(tasks.named('jpackageInstaller'))
}
