# Основные параметры индекса
index.path=search-index
lucene.version=9.9.1
index.ramBufferSizeMB=256
index.threads=4

# Параметры поиска
search.phraseSlop=2
search.defaultOperator=AND

# Параметры Tika
# Ограничение длины извлекаемого текста защищает от OOM на больших PDF/XLSX
# и фиксируется в логах при усечении.
tika.maxStringLength=200000
tika.timeoutSeconds=30
